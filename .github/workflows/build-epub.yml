name: Build EPUB and PDF

on:
  workflow_dispatch:
  push:
    branches:
      - lavanya/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra poppler-utils
          pip3 install img2pdf

      - name: Create output directories
        run: |
          mkdir -p drafts/v2
          mkdir -p published/v1

      - name: Build EPUB
        run: |
          pandoc \
            manuscript/front_matter.md \
            manuscript/part1/ch01_why_big_teams.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part1/ch02_end_of_linear_scaling.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part1/ch03_what_ai_changes.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part2/ch04_headcount_to_leverage.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part2/ch05_why_six.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part2/ch06_six_core_roles.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part2/ch07_human_judgment.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part2/ch08_designing_speed.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part3/ch09_rapid_prototyping.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part3/ch10_decision_making.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part3/ch11_small_teams.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part3/ch12_ai_xr_frontier.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part4/ch13_leadership.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part4/ch14_burnout.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part4/ch15_when_to_hire.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part4/ch16_scaling.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/back_matter.md \
            --metadata-file=manuscript/metadata.yaml \
            --css=manuscript/epub.css \
            --resource-path=manuscript:published/v1 \
            --split-level=2 \
            -o drafts/v2/SmallTeamsStrongSystems-v2.epub

      - name: Prepare cover PDFs (shared by v1 and v2)
        run: |
          # Convert cover images to US Letter PDFs to match interior page size
          img2pdf published/v1/cover_front.jpg --pagesize Letter -o /tmp/cover_front.pdf
          img2pdf published/v1/cover_back.png  --pagesize Letter -o /tmp/cover_back.pdf

      - name: Build v2 PDF (improved content, from the manuscript)
        run: |
          # Strip EPUB-only and front-matter fields — front_matter.md handles title/author manually.
          grep -Ev "^title:|^subtitle:|^author:|^toc|^cover-image:" manuscript/metadata.yaml > /tmp/pdf-metadata.yaml

          cd manuscript
          pandoc \
            --metadata-file=/tmp/pdf-metadata.yaml \
            --include-in-header=../build/book-style.tex \
            --lua-filter=../build/drop-hr.lua \
            --variable mainfont="TeX Gyre Pagella" \
            --variable sansfont="TeX Gyre Heros" \
            --variable monofont="TeX Gyre Cursor" \
            --variable classoption=openany \
            front_matter.md \
            part1/ch01_why_big_teams.md \
            part1/ch02_end_of_linear_scaling.md \
            part1/ch03_what_ai_changes.md \
            part2/ch04_headcount_to_leverage.md \
            part2/ch05_why_six.md \
            part2/ch06_six_core_roles.md \
            part2/ch07_human_judgment.md \
            part2/ch08_designing_speed.md \
            part3/ch09_rapid_prototyping.md \
            part3/ch10_decision_making.md \
            part3/ch11_small_teams.md \
            part3/ch12_ai_xr_frontier.md \
            part4/ch13_leadership.md \
            part4/ch14_burnout.md \
            part4/ch15_when_to_hire.md \
            part4/ch16_scaling.md \
            back_matter.md \
            --to pdf \
            --pdf-engine xelatex \
            --variable geometry:letterpaper \
            --variable geometry:top=25.4mm \
            --variable geometry:bottom=25.4mm \
            --variable geometry:left=31.75mm \
            --variable geometry:right=25.4mm \
            -o /tmp/v2-interior.pdf

          # Merge: front cover + interior content + back cover (from repo root)
          cd "$GITHUB_WORKSPACE"
          pdfunite /tmp/cover_front.pdf /tmp/v2-interior.pdf /tmp/cover_back.pdf \
            drafts/v2/SmallTeamsStrongSystems-v2.pdf

      - name: Build v1 PDF (original content, from the v1 EPUB)
        run: |
          # The v1 PDF must reflect the ORIGINAL first-published book, so it is
          # generated from the v1 EPUB, not the (improved) manuscript. It is
          # rendered as a CONTINUOUS FLOW that mirrors how the EPUB reads: no
          # book-class chapter/part page breaks and no part-divider pages, so the
          # content flows without imposed gaps. Only the page furniture (clean
          # headers/footers), figure handling and covers are shared with v2.
          pandoc \
            published/v1/SmallTeamsStrongSystems-v1-published.epub \
            --include-in-header=build/book-style.tex \
            --lua-filter=build/drop-hr.lua \
            --lua-filter=build/epub-meta.lua \
            --toc --toc-depth=2 \
            --variable mainfont="TeX Gyre Pagella" \
            --variable sansfont="TeX Gyre Heros" \
            --variable monofont="TeX Gyre Cursor" \
            --variable geometry:letterpaper \
            --variable geometry:top=25.4mm \
            --variable geometry:bottom=25.4mm \
            --variable geometry:left=31.75mm \
            --variable geometry:right=25.4mm \
            --to pdf \
            --pdf-engine xelatex \
            -o /tmp/v1-interior.pdf

          # Merge: front cover + interior content + back cover
          pdfunite /tmp/cover_front.pdf /tmp/v1-interior.pdf /tmp/cover_back.pdf \
            published/v1/SmallTeamsStrongSystems-v1-published.pdf

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallTeamsStrongSystems-v2-epub
          path: drafts/v2/SmallTeamsStrongSystems-v2.epub
          retention-days: 30

      - name: Upload v2 PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallTeamsStrongSystems-v2-pdf
          path: drafts/v2/SmallTeamsStrongSystems-v2.pdf
          retention-days: 30

      - name: Upload v1 PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallTeamsStrongSystems-v1-pdf
          path: published/v1/SmallTeamsStrongSystems-v1-published.pdf
          retention-days: 30
