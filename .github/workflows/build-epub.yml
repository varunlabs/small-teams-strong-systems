name: Build EPUB and PDF

on:
  workflow_dispatch:
  push:
    branches:
      - lavanya/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra poppler-utils calibre fonts-liberation fontconfig
          pip3 install img2pdf pypdf pymupdf

          # The EPUB's body font is Georgia, which is not on the runner. Install the
          # vendored Gelasio (an OFL, metric-compatible Georgia substitute) so the
          # rendered PDF matches the EPUB's typography instead of falling back to a
          # Times-like face. Helvetica Neue -> Liberation Sans (Arial-metric) is
          # already a close match and comes from fonts-liberation.
          mkdir -p ~/.fonts
          cp build/fonts/*.ttf ~/.fonts/
          fc-cache -f >/dev/null
          echo "Gelasio available:"; fc-list | grep -i gelasio | head -3

          echo "=== DEBUG: custom-size / unit flags ==="
          ebook-convert dummy.epub dummy.pdf -h 2>&1 | grep -i -B1 -A3 "custom-size\|--unit" || echo "not found"

      - name: Create output directories
        run: |
          mkdir -p drafts/v2
          mkdir -p published/v1

      - name: Build EPUB
        run: |
          pandoc \
            manuscript/front_matter.md \
            manuscript/part1/ch01_why_big_teams.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part1/ch02_end_of_linear_scaling.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part1/ch03_what_ai_changes.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part2/ch04_headcount_to_leverage.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part2/ch05_why_six.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part2/ch06_six_core_roles.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part2/ch07_human_judgment.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part2/ch08_designing_speed.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part3/ch09_rapid_prototyping.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part3/ch10_decision_making.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part3/ch11_small_teams.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part3/ch12_ai_xr_frontier.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part4/ch13_leadership.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part4/ch14_burnout.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part4/ch15_when_to_hire.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/part4/ch16_scaling.md \
            manuscript/chapter_gap_all_formats.md \
            manuscript/back_matter.md \
            --metadata-file=manuscript/metadata.yaml \
            --css=manuscript/epub.css \
            --resource-path=manuscript:published/v1 \
            --split-level=2 \
            -o drafts/v2/SmallTeamsStrongSystems-v2.epub

      - name: Prepare cover PDFs (shared by v1 and v2)
        run: |
          # Convert cover images to US Letter PDFs to match interior page size
          img2pdf published/v1/cover_front.jpg --pagesize Letter -o /tmp/cover_front.pdf
          img2pdf published/v1/cover_back.png  --pagesize Letter -o /tmp/cover_back.pdf

      - name: Build v2 PDF (RENDER the v2 EPUB's own layout via Calibre)
        run: |
          # Same treatment as v1: render the v2 EPUB's actual HTML+CSS through
          # Calibre's browser engine so the PDF reproduces the EPUB's designed
          # pages, rather than re-typesetting from extracted text. The v2 EPUB
          # embeds a cover, so strip it from a temp copy first and add the
          # front/back covers ourselves (identical cover handling to v1).
          python3 build/strip-epub-cover.py \
            drafts/v2/SmallTeamsStrongSystems-v2.epub /tmp/v2-nocover.epub

          export QT_QPA_PLATFORM=offscreen
          ebook-convert \
            /tmp/v2-nocover.epub \
            /tmp/v2-interior.pdf \
            --paper-size letter \
            --pdf-page-margin-top 54 \
            --pdf-page-margin-bottom 54 \
            --pdf-page-margin-left 72 \
            --pdf-page-margin-right 54 \
            --pdf-page-numbers \
            --pdf-serif-family "Gelasio" \
            --pdf-sans-family "Liberation Sans" \
            --pdf-mono-family "Liberation Mono" \
            --page-breaks-before "/" \
            --preserve-cover-aspect-ratio \
            --disable-font-rescaling \
            --extra-css build/calibre-extra.css \
            --pdf-add-toc \
            --toc-title "Contents" \
            --level1-toc "//h:h1" \
            --level2-toc "//h:h2" \
            --duplicate-links-in-toc

          # Merge: front cover + rendered interior + back cover
          pdfunite /tmp/cover_front.pdf /tmp/v2-interior.pdf /tmp/cover_back.pdf \
            /tmp/v2-with-toc-at-end.pdf

          # Calibre's --pdf-add-toc always appends the TOC at the end and bakes
          # every page number as static text at generation time. Move the TOC to
          # its proper spot (after "Who This Book Is For", before the
          # Introduction) and correct every footer/TOC number that move
          # invalidates. See build/reposition-toc.py for details.
          python3 build/reposition-toc.py \
            /tmp/v2-with-toc-at-end.pdf \
            drafts/v2/SmallTeamsStrongSystems-v2.pdf \
            build/fonts/Gelasio-Regular.ttf

      - name: Build v2 KDP print manuscript (6x9in interior, no cover)
        run: |
          # KDP's paperback/hardcover "manuscript" upload must be the interior
          # ONLY — no cover pages merged in, since the cover is uploaded as a
          # separate file later. Same content/rendering as the v2 PDF above,
          # just at 6x9in trim size with KDP-compliant margins instead of US
          # Letter. Margins: 0.75in on every side, which satisfies KDP's inside
          # (gutter) margin requirement for any page count up to 700 (see
          # https://kdp.amazon.com print requirements) — safely above what this
          # book needs.
          export QT_QPA_PLATFORM=offscreen
          ebook-convert \
            /tmp/v2-nocover.epub \
            /tmp/v2-kdp-interior-raw.pdf \
            --pdf-page-numbers \
            --custom-size "6x9" \
            --unit inch \
            --pdf-page-margin-top 54 \
            --pdf-page-margin-bottom 54 \
            --pdf-page-margin-left 54 \
            --pdf-page-margin-right 54 \
            --pdf-serif-family "Gelasio" \
            --pdf-sans-family "Liberation Sans" \
            --pdf-mono-family "Liberation Mono" \
            --page-breaks-before "/" \
            --disable-font-rescaling \
            --extra-css build/calibre-extra.css \
            --pdf-add-toc \
            --toc-title "Contents" \
            --level1-toc "//h:h1" \
            --level2-toc "//h:h2" \
            --duplicate-links-in-toc

          python3 build/reposition-toc.py \
            /tmp/v2-kdp-interior-raw.pdf \
            drafts/v2/SmallTeamsStrongSystems-v2-KDP-manuscript-6x9.pdf \
            build/fonts/Gelasio-Regular.ttf \
            --no-covers

      - name: Build v1 PDF (RENDER the v1 EPUB's own layout via Calibre)
        run: |
          # The v1 PDF must reproduce the EPUB's actual VISUAL DESIGN, not a
          # re-typeset reconstruction. Pandoc discards the EPUB stylesheet, so we
          # render the EPUB through Calibre's browser engine, which honours the
          # EPUB's own CSS (part-header styling, chapter labels, figure boxes,
          # page-break rules, spacing, hierarchy). Georgia -> Gelasio (vendored,
          # metric-compatible) and Helvetica Neue -> Liberation Sans (Arial-metric).
          # QT_QPA_PLATFORM=offscreen lets the Qt/Chromium engine run headless.
          export QT_QPA_PLATFORM=offscreen
          ebook-convert \
            published/v1/SmallTeamsStrongSystems-v1-published.epub \
            /tmp/v1-interior.pdf \
            --paper-size letter \
            --pdf-page-margin-top 54 \
            --pdf-page-margin-bottom 54 \
            --pdf-page-margin-left 72 \
            --pdf-page-margin-right 54 \
            --pdf-page-numbers \
            --pdf-serif-family "Gelasio" \
            --pdf-sans-family "Liberation Sans" \
            --pdf-mono-family "Liberation Mono" \
            --page-breaks-before "/" \
            --preserve-cover-aspect-ratio \
            --disable-font-rescaling \
            --extra-css build/calibre-extra.css \
            --pdf-add-toc \
            --toc-title "Contents" \
            --level1-toc "//h:h1" \
            --level2-toc "//h:h2" \
            --duplicate-links-in-toc

          # Merge: front cover + rendered interior + back cover
          pdfunite /tmp/cover_front.pdf /tmp/v1-interior.pdf /tmp/cover_back.pdf \
            /tmp/v1-with-toc-at-end.pdf

          # Reposition the TOC and correct page numbers (see the v2 step above
          # for why this is needed).
          python3 build/reposition-toc.py \
            /tmp/v1-with-toc-at-end.pdf \
            published/v1/SmallTeamsStrongSystems-v1-published.pdf \
            build/fonts/Gelasio-Regular.ttf

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallTeamsStrongSystems-v2-epub
          path: drafts/v2/SmallTeamsStrongSystems-v2.epub
          retention-days: 30

      - name: Upload v2 PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallTeamsStrongSystems-v2-pdf
          path: drafts/v2/SmallTeamsStrongSystems-v2.pdf
          retention-days: 30

      - name: Upload v1 PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallTeamsStrongSystems-v1-pdf
          path: published/v1/SmallTeamsStrongSystems-v1-published.pdf
          retention-days: 30

      - name: Upload v2 KDP manuscript artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallTeamsStrongSystems-v2-KDP-manuscript-6x9
          path: drafts/v2/SmallTeamsStrongSystems-v2-KDP-manuscript-6x9.pdf
          retention-days: 30
